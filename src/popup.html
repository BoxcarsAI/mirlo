<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirlo</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        margin: 0;
        padding: 12px 14px 14px;
        width: 240px;
        color: #1f2933;
        background: #ffffff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .domain {
        font-size: 12px;
        color: #4b5563;
        margin-bottom: 8px;
      }
      .site-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #ecfdf3;
        color: #047857;
        font-size: 11px;
        font-weight: 600;
      }
      .status-pill.is-disabled {
        background: #f1f5f9;
        color: #6b7280;
      }
      .toggle-button {
        margin-left: auto;
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        font-size: 11px;
        cursor: pointer;
      }
      .toggle-button.is-primary {
        background: #111827;
        color: #ffffff;
        border-color: #111827;
      }
      .divider {
        height: 1px;
        background: #e5e7eb;
        margin: 10px 0;
      }
      .meta-line {
        font-size: 11px;
        color: #374151;
        margin: 0 0 6px;
      }
      .meta-line:last-of-type {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <h1>Mirlo</h1>
    <div class="domain" id="site-domain">Loading site…</div>
    <div class="site-row">
      <div class="status-pill" id="site-status">✓ Enabled</div>
      <button class="toggle-button" id="toggle-site" type="button">Disable</button>
    </div>
    <div class="divider"></div>
    <p class="meta-line">Target: Spanish</p>
    <p class="meta-line" id="ai-status">AI Status: Checking…</p>
    <p class="meta-line" id="page-language">Page Language: Checking…</p>
    <script src="popup.js"></script>
  </body>
</html>
