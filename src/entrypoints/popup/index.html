<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__MSG_actionTitle__</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        margin: 0;
        padding: 12px 14px 14px;
        width: 240px;
        color: #1f2933;
        background: #ffffff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .domain {
        font-size: 12px;
        color: #4b5563;
        margin-bottom: 8px;
      }
      .site-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #ecfdf3;
        color: #047857;
        font-size: 11px;
        font-weight: 600;
      }
      .status-pill.is-disabled {
        background: #f1f5f9;
        color: #6b7280;
      }
      .toggle-button {
        margin-left: auto;
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        font-size: 11px;
        cursor: pointer;
      }
      .toggle-button.is-primary {
        background: #111827;
        color: #ffffff;
        border-color: #111827;
      }
      .divider {
        height: 1px;
        background: #e5e7eb;
        margin: 10px 0;
      }
      .language-info {
        margin-bottom: 10px;
      }
      .language-pair {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
      }
      .language-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f0fdfa;
        color: #0f766e;
        font-size: 11px;
        font-weight: 600;
      }
      .language-arrow {
        font-size: 14px;
        color: #9ca3af;
      }
      .language-label {
        font-size: 11px;
        font-weight: 600;
        color: #9ca3af;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .options-link {
        color: #0f766e;
        text-decoration: none;
        font-weight: 500;
      }
      .options-link:hover {
        text-decoration: underline;
      }
      .meta-line {
        font-size: 11px;
        color: #374151;
        margin: 0 0 6px;
      }
      .meta-line:last-of-type {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="appName">Mirlo</h1>
    <div class="domain" id="site-domain" data-i18n="popupLoadingSite">Loading site…</div>
    <div class="site-row">
      <div class="status-pill" id="site-status" data-i18n="popupStatusEnabled">✓ Enabled</div>
      <button class="toggle-button" id="toggle-site" type="button" data-i18n="popupDisableBtn">Disable</button>
    </div>
    <div class="language-info">
      <div class="language-pair">
        <span class="language-label" data-i18n="popupLearningLabel">Learning</span>
        <span class="language-badge" id="learning-lang" data-i18n="langEs">Spanish</span>
      </div>
    </div>
    <div class="divider"></div>
    <p class="meta-line">
      <a href="#" id="open-options" class="options-link" data-i18n="popupChangeLanguages">Change language →</a>
    </p>
    <p class="meta-line" id="ai-status" data-i18n="popupAiStatusInit">AI Status: Checking…</p>
    <p class="meta-line" id="page-language" data-i18n="popupPageLangInit">Page Language: Checking…</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
