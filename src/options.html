<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirlo Options</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="options-header">
      <div class="options-header-inner">
        <img
          class="options-hero-banner"
          src="assets/mirlo-hero-banner.png"
          alt="Mirlo bird with colorful language characters"
        />
        <div class="options-header-text">
          <h1 class="options-title">Mirlo Settings</h1>
          <p class="options-subtitle">Learn languages naturally</p>
        </div>
      </div>
    </header>

    <main class="options-main">
      <form class="options-card" aria-label="Mirlo language preferences">
        <h2 class="options-section-title">Language Preferences</h2>

        <div class="options-field">
          <label class="options-label" for="native-language">
            Native Language
            <span class="options-label-hint">The language you know best</span>
          </label>
          <select id="native-language" class="options-select">
            <option value="en">🇬🇧 English</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="fr">🇫🇷 French</option>
            <option value="de">🇩🇪 German</option>
          </select>
        </div>

        <div class="options-field">
          <label class="options-label" for="learning-language">
            Learning Language
            <span class="options-label-hint">The language you want to learn</span>
          </label>
          <select id="learning-language" class="options-select">
            <option value="es">🇪🇸 Spanish</option>
            <option value="en">🇬🇧 English</option>
            <option value="fr">🇫🇷 French</option>
            <option value="de">🇩🇪 German</option>
          </select>
        </div>

        <button type="button" id="save-button" class="options-save-button">
          Save Settings
        </button>

        <div id="save-status" class="options-status" role="status" aria-live="polite"></div>
      </form>
    </main>

    <script src="options.js"></script>
  </body>
</html>
