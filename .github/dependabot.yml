version: 2
updates:
  - package-ecosystem: "npm"
    # 7-day supply-chain cooldown — see factory-ops/docs/supply-chain-standard.md
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "tabrez"
